services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - paylater-network


  authservice:
    image: chandini9/authservice:latest
    container_name: authservice

    restart: always

    environment:
      SERVICE_NAME: AuthService
      SERVICE_PORT: 8081

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

    ports:
      - "8081:8081"

    depends_on:
      - mysql

    networks:
      - paylater-network


  userservice:
    image: chandini9/userservice:latest
    container_name: userservice

    restart: always

    environment:
      SERVICE_NAME: UserService
      SERVICE_PORT: 8082

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

    ports:
      - "8082:8082"

    depends_on:
      - mysql

    networks:
      - paylater-network


  merchantservice:
    image: chandini9/merchantservice:latest
    container_name: merchantservice

    restart: always

    environment:
      SERVICE_NAME: MerchantService
      SERVICE_PORT: 8083

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

    ports:
      - "8083:8083"

    depends_on:
      - mysql

    networks:
      - paylater-network


  transactionservice:
    image: chandini9/transactionservice:latest
    container_name: transactionservice

    restart: always

    environment:
      SERVICE_NAME: TransactionService
      SERVICE_PORT: 8084

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      USER_SERVICE_URL: ${USER_SERVICE_URL}
      MERCHANT_SERVICE_URL: ${MERCHANT_SERVICE_URL}

    ports:
      - "8084:8084"

    depends_on:
      - mysql

    networks:
      - paylater-network


  paybackservice:
    image: chandini9/paybackservice:latest
    container_name: paybackservice

    restart: always

    environment:
      SERVICE_NAME: PaybackService
      SERVICE_PORT: 8085

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      USER_SERVICE_URL: ${USER_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}

    ports:
      - "8085:8085"

    depends_on:
      - mysql

    networks:
      - paylater-network


  reportservice:
    image: chandini9/reportservice:latest
    container_name: reportservice

    restart: always

    environment:
      SERVICE_NAME: ReportService
      SERVICE_PORT: 8086

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      USER_SERVICE_URL: ${USER_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}

    ports:
      - "8086:8086"

    depends_on:
      - mysql

    networks:
      - paylater-network


  apigateway:
    image: chandini9/apigateway:latest
    container_name: apigateway

    restart: always

    environment:
      SERVICE_NAME: APIGateway
      SERVICE_PORT: 8080

      JWT_SECRET: ${JWT_SECRET}

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      MERCHANT_SERVICE_URL: ${MERCHANT_SERVICE_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL}
      PAYBACK_SERVICE_URL: ${PAYBACK_SERVICE_URL}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL}

    ports:
      - "8080:8080"

    depends_on:
      - authservice
      - userservice
      - merchantservice
      - transactionservice
      - paybackservice
      - reportservice

    networks:
      - paylater-network


volumes:
  mysql-data:


networks:
  paylater-network:
    driver: bridge
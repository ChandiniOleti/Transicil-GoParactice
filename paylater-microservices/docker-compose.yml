services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paylaterdb
      MYSQL_USER: chandini
      MYSQL_PASSWORD: Chandini@123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - paylater-network


  authservice:
    image: chandini9/authservice:latest
    container_name: authservice

    restart: always

    env_file:
      - AuthService/.env

    ports:
      - "8081:8081"

    depends_on:
      - mysql

    networks:
      - paylater-network


  userservice:
    image: chandini9/userservice:latest
    container_name: userservice

    restart: always

    env_file:
      - UserService/.env

    ports:
      - "8082:8082"

    depends_on:
      - mysql

    networks:
      - paylater-network


  merchantservice:
    image: chandini9/merchantservice:latest
    container_name: merchantservice

    restart: always

    env_file:
      - MerchantService/.env

    ports:
      - "8083:8083"

    depends_on:
      - mysql

    networks:
      - paylater-network


  transactionservice:
    image: chandini9/transactionservice:latest
    container_name: transactionservice

    restart: always

    env_file:
      - TransactionService/.env

    ports:
      - "8084:8084"

    depends_on:
      - mysql

    networks:
      - paylater-network


  paybackservice:
    image: chandini9/paybackservice:latest
    container_name: paybackservice

    restart: always

    env_file:
      - PaybackService/.env

    ports:
      - "8085:8085"

    depends_on:
      - mysql

    networks:
      - paylater-network


  reportservice:
    image: chandini9/reportservice:latest
    container_name: reportservice

    restart: always

    env_file:
      - ReportService/.env

    ports:
      - "8086:8086"

    depends_on:
      - mysql

    networks:
      - paylater-network


  apigateway:
    image: chandini9/apigateway:latest
    container_name: apigateway

    restart: always

    env_file:
      - APIGateway/.env

    ports:
      - "8080:8080"

    depends_on:
      - authservice
      - userservice
      - merchantservice
      - transactionservice
      - paybackservice
      - reportservice

    networks:
      - paylater-network


volumes:
  mysql-data:


networks:
  paylater-network:
    driver: bridge